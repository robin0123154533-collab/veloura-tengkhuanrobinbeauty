<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RobinTV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      overflow-x: hidden;
    }
    .hero {
      height: 100vh;
      background: linear-gradient(to bottom, rgba(0,0,0,.2), #000), url("profile.jpg") center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
    }
    .badge {
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 30px;
      width: fit-content;
      margin-bottom: 15px;
      font-size: 14px;
    }
    h1 {
      font-size: 58px;
      letter-spacing: 3px;
    }
    .subtitle {
      font-size: 18px;
      color: #ddd;
      margin: 10px 0 25px;
    }
    .btn {
      background: white;
      color: black;
      padding: 15px 28px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: bold;
      width: fit-content;
    }
    .section {
      min-height: 100vh;
      padding: 40px 20px;
      background: #050505;
    }
    .profile {
      text-align: center;
      margin-bottom: 30px;
    }
    .profile img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
    }
    .profile h2 {
      margin-top: 15px;
      font-size: 28px;
    }
    .profile p {
      color: #aaa;
      margin-top: 8px;
    }
    .video-card {
      max-width: 420px;
      height: 680px;
      margin: 25px auto;
      border-radius: 28px;
      background: linear-gradient(160deg, #111, #222);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(255,255,255,.08);
      display: flex;
      align-items: flex-end;
      padding: 25px;
    }
    .video-card::before {
      content: "VIDEO";
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      color: rgba(255,255,255,.12);
      letter-spacing: 4px;
    }
    .video-info {
      z-index: 2;
    }
    .video-info h3 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .video-info p {
      color: #ccc;
    }
    .actions {
      position: absolute;
      right: 18px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      font-size: 26px;
    }
    .footer {
      text-align: center;
      padding: 30px;
      color: #777;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="badge">AI • Lifestyle • Vision</div>
    <h1>ROBIN</h1>
    <div class="subtitle">@tengkhuanrobin · Personal Video Channel</div>
    <a href="#videos" class="btn">Enter RobinTV</a>
  </div>

  <section class="section" id="videos">
    <div class="profile">
      <img src="profile.jpg" alt="Robin Profile">
      <h2>RobinTV</h2>
      <p>AI Lifestyle · Travel · Motivation · Future</p>
    </div>

    <div class="video-card">
      <div class="actions">
        <div>❤️</div>
        <div>💬</div>
        <div>↗️</div>
      </div>
      <div class="video-info">
        <h3>My First Video</h3>
        <p>Upload your video later and replace this section.</p>
      </div>
    </div>

    <div class="video-card">
      <div class="actions">
        <div>❤️</div>
        <div>💬</div>
        <div>↗️</div>
      </div>
      <div class="video-info">
        <h3>AI Lifestyle</h3>
        <p>Coming soon...</p>
      </div>
    </div>
  </section>

  <div class="footer">
    © 2026 RobinTV. Built for personal brand.
  </div>

</body>
</html>
